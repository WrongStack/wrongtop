name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # darwin builds link IOKit (cgo), so this must run on macOS: the
    # arm64 runner builds arm64 natively and cross-compiles amd64 via
    # Apple clang's -arch support. Pure-Go linux/windows targets cross
    # fine from here too — one job, all eight artifacts.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # a missing or expired tap PAT must not fail the release: probe it
      # first and hand goreleaser an empty token (skip_upload) if rejected
      - name: Check Homebrew tap token
        id: tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && curl -fsS -o /dev/null \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/wrongstack/homebrew-tap; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is missing or rejected; the cask will not be pushed to wrongstack/homebrew-tap"
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # empty unless the probe above accepted it; empty skips the tap push
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.ok == 'true' && secrets.HOMEBREW_TAP_TOKEN || '' }}

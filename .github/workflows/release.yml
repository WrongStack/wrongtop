name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # darwin builds link IOKit (cgo), so this must run on macOS: the
    # arm64 runner builds arm64 natively and cross-compiles amd64 via
    # Apple clang's -arch support. Pure-Go linux/windows targets cross
    # fine from here too — one job, all eight artifacts.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # only used when brews.skip_upload flips to false; empty until
          # the HOMEBREW_TAP_TOKEN secret exists, which is fine
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
